# Ships database migrations with the code.
#
# - On PRs touching supabase/: verify migrations apply cleanly to a fresh DB
#   and the pgTAP suite passes. Nothing touches production.
# - On push to main (i.e. after merge): same verification, then
#   `supabase db push` to the linked production project.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   project ref, the <ref> in https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD   database password for the production project

name: Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  # Manual re-run from the Actions tab (e.g. after fixing a failed deploy).
  workflow_dispatch:

jobs:
  test:
    name: Apply migrations + run DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs the Supabase CLI pinned in package.json so CI matches local.
      - run: npm ci

      # Spins up a throwaway local stack (Docker is preinstalled on ubuntu
      # runners) and applies every migration from scratch. Skip services the
      # tests don't need to keep startup fast.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector

      - name: Run pgTAP tests
        run: npx supabase test db

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop --no-backup

  deploy:
    name: Push migrations to production
    needs: test
    # Only after merge to main (or a manual run on main) — never from PRs.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional: add required reviewers to this environment in repo settings to
    # get a manual "approve" gate before every production push.
    environment: production
    # Never run two pushes against prod at once; queue instead of cancelling.
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Shows exactly which migrations are about to be applied, in the log.
      - name: Preview pending migrations
        run: npx supabase db push --dry-run

      - name: Apply migrations
        run: npx supabase db push
